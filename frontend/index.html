<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Oddye IA</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="layout" id="layout">

        <!-- BARRA LATERAL -->
        <aside class="sidebar" id="sidebar">

            <div class="sidebar-head">
                <button id="newChatBtn" class="new-chat-btn"
                    title="Empezar una conversación nueva">

                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
                        <path d="M12 5v14M5 12h14"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round" />
                    </svg>

                    <span>Nuevo chat</span>
                </button>
            </div>

            <!-- BUSCADOR DE CHATS -->
            <div class="chat-search-wrap">
                <input
                    id="chatSearch"
                    class="chat-search"
                    type="text"
                    placeholder="Buscar en tus chats..."
                    autocomplete="off"
                    spellcheck="false"
                />
            </div>

            <!-- LISTA DE CONVERSACIONES -->
            <div class="chat-list" id="chatList"></div>

        </aside>

        <!-- APLICACIÓN PRINCIPAL -->
        <div class="app">

            <!-- ENCABEZADO -->
            <header class="topbar">

                <div class="brand">

                    <!-- BOTÓN PARA MOSTRAR U OCULTAR LA BARRA LATERAL -->
                    <button
                        id="sidebarToggle"
                        class="toggle-btn"
                        title="Mostrar u ocultar los chats">

                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                            <rect
                                x="3.5"
                                y="5"
                                width="17"
                                height="14"
                                rx="2.5"
                                stroke="currentColor"
                                stroke-width="1.4"
                            />

                            <path
                                d="M9.5 5v14"
                                stroke="currentColor"
                                stroke-width="1.4"
                            />
                        </svg>

                    </button>

                    <span class="brand-dot"></span>
                    <span class="brand-name">Oddye</span>

                </div>

                <!-- ESTADO DE LA IA -->
                <div class="status" id="status">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">lista</span>
                </div>

            </header>

            <!-- ÁREA DE CONVERSACIÓN -->
            <main class="chat" id="chat">

                <!-- MENSAJE INICIAL -->
                <div class="empty-state" id="emptyState">
                    <p>Dime lo que piensas.</p>
                </div>

            </main>

            <!-- ÁREA PARA ESCRIBIR MENSAJES -->
            <footer class="composer">

                <!-- BOTÓN DE PENSAMIENTO -->
                <button
                    id="brainBtn"
                    class="toggle-btn"
                    title="Modo pensamiento (razonamiento profundo)">

                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                        <path
                            d="M9 3a3 3 0 0 0-3 3c0 .35.05.68.14 1A3 3 0 0 0 4 10c0 1 .4 1.9 1.05 2.55A3 3 0 0 0 5 14a3 3 0 0 0 3 3v1a3 3 0 0 0 3 3h0a3 3 0 0 0 3-3v-1a3 3 0 0 0 3-3 3 3 0 0 0-.05-1.45A3 3 0 0 0 20 10a3 3 0 0 0-2.14-2.88c.09-.32.14-.65.14-1a3 3 0 0 0-3-3 3 3 0 0 0-2 .76A3 3 0 0 0 11 3h-2Z"
                            stroke="currentColor"
                            stroke-width="1.4"
                            stroke-linejoin="round"
                        />

                        <path
                            d="M9 17V8M13 17V6"
                            stroke="currentColor"
                            stroke-width="1.2"
                        />
                    </svg>

                </button>

                <!-- BOTÓN DE RESPUESTA POR VOZ -->
                <button
                    id="voiceOutBtn"
                    class="toggle-btn"
                    title="La IA responde en voz alta">

                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                        <path
                            d="M4 9v6h3l4 4V5L7 9H4Z"
                            stroke="currentColor"
                            stroke-width="1.4"
                            stroke-linejoin="round"
                        />

                        <path
                            d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12"
                            stroke="currentColor"
                            stroke-width="1.4"
                            stroke-linecap="round"
                        />
                    </svg>

                </button>

                <!-- BOTÓN DE DICTADO POR MICRÓFONO -->
                <button
                    id="micBtn"
                    class="toggle-btn"
                    title="Háblale a tu IA">

                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                        <rect
                            x="9"
                            y="3"
                            width="6"
                            height="11"
                            rx="3"
                            stroke="currentColor"
                            stroke-width="1.4"
                        />

                        <path
                            d="M5 11a7 7 0 0 0 14 0M12 18v3"
                            stroke="currentColor"
                            stroke-width="1.4"
                            stroke-linecap="round"
                        />
                    </svg>

                </button>

                <!-- BOTÓN DE ACTIVACIÓN POR PALABRA CLAVE -->
                <button
                    id="listenBtn"
                    class="toggle-btn"
                    title="Escucha por nombre: di &quot;Oddye&quot; y te responde">

                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                        <path
                            d="M3 12h2.5M8 8v8M12 4.5v15M16 8v8M18.5 12H21"
                            stroke="currentColor"
                            stroke-width="1.6"
                            stroke-linecap="round"
                        />
                    </svg>

                </button>

                <!-- CAMPO DE TEXTO -->
                <textarea
                    id="input"
                    class="composer-input"
                    placeholder="Escríbele a tu IA..."
                    rows="1"
                ></textarea>

                <!-- BOTÓN DE ENVÍO -->
                <button
                    id="sendBtn"
                    class="send-btn"
                    title="Enviar">

                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                        <path
                            d="M4 12L20 4L13 20L11 13L4 12Z"
                            stroke="currentColor"
                            stroke-width="1.6"
                            stroke-linejoin="round"
                        />
                    </svg>

                </button>

            </footer>

        </div>

    </div>

    <!-- ARCHIVO JAVASCRIPT -->
    <script src="app.js"></script>

</body>

</html>
